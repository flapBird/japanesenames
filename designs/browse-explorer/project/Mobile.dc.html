<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse Explorer — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#315c4b;text-decoration:none}
a:hover{color:#244638}
</style>
</helmet>

<div style="background-color:#f7f5ef;background-image:linear-gradient(rgba(49,92,75,0.025) 1px,transparent 1px);background-size:100% 32px;font-family:Inter,'Noto Sans JP',-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#19241f;">

  <header style="background:rgba(255,254,251,0.94);border-bottom:1px solid #deddd5;">
    <div style="display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 18px;">
      <a href="https://japanesenames.site/" style="display:flex;align-items:center;gap:9px;">
        <span aria-hidden="true" style="display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#315c4b;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fffefb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.6-4.5-2-7-2v14c2.5 0 5 .4 7 2 2-1.6 4.5-2 7-2V4c-2.5 0-5 .4-7 2z"/><path d="M12 6v14"/></svg>
        </span>
        <span style="font-size:15.5px;font-weight:700;">Japanese Names</span>
      </a>
      <span style="border:1px solid #deddd5;background:#fffefb;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;">Menu</span>
    </div>
  </header>

  <div style="padding:20px 18px 0;">
    <p style="margin:0;font-size:12px;color:#647068;">Home <span aria-hidden="true" style="margin:0 6px;color:#b9c4bc;">/</span> Japanese Last Names</p>
    <div style="margin-top:16px;border:1px solid #deddd5;border-top:3px solid #6f927f;border-radius:1rem;background:#fffefb;box-shadow:0 18px 50px rgb(25 36 31 / 0.08);overflow:hidden;">
      <div style="padding:14px 16px;">
        <label for="q" style="display:block;font-size:0.75rem;font-weight:700;color:#465149;">Search Japanese last names</label>
        <input id="q" placeholder="Kanji, romaji, or hiragana" style="margin-top:6px;width:100%;box-sizing:border-box;border:1px solid #deddd5;border-radius:0.7rem;background:#fffefb;padding:11px 14px;font-size:0.9rem;color:#19241f;" />
        <div style="margin-top:10px;display:flex;gap:8px;">
          <div style="flex:1;position:relative;">
            <select style="width:100%;appearance:none;border:1px solid #deddd5;border-radius:0.7rem;background:#fffefb;padding:10px 12px;font-size:0.82rem;color:#19241f;">
              <option>Most common first</option>
            </select>
            <svg aria-hidden="true" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#59645d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div style="flex:1;position:relative;">
            <select style="width:100%;appearance:none;border:1px solid #deddd5;border-radius:0.7rem;background:#fffefb;padding:10px 12px;font-size:0.82rem;color:#19241f;">
              <option>Any origin</option>
            </select>
            <svg aria-hidden="true" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#59645d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <button style="margin-top:10px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #deddd5;background:#faf9f5;border-radius:999px;padding:11px 0;font-size:0.85rem;font-weight:700;color:#19241f;" type="button">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#315c4b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="#315c4b" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="#315c4b" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="#315c4b" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="#315c4b" stroke="none"/></svg>
          Random surname
        </button>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:7px;border-top:1px solid #efeee8;padding:10px 16px;background:#faf9f5;">
        <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:#315c4b;color:#fffefb;font-size:0.66rem;font-weight:800;">All</span>
        <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #deddd5;background:#fffefb;color:#59645d;font-size:0.68rem;font-weight:700;">S</span>
        <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #deddd5;background:#fffefb;color:#59645d;font-size:0.68rem;font-weight:700;">T</span>
        <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #deddd5;background:#fffefb;color:#59645d;font-size:0.68rem;font-weight:700;">Y</span>
        <span style="margin-left:auto;font-size:0.74rem;color:#747d77;">220 matches</span>
      </div>
    </div>

    <div style="margin-top:22px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;">
      <h2 style="margin:0;font-family:Georgia,'Yu Mincho','Noto Sans JP',serif;font-weight:700;font-size:1.4rem;letter-spacing:-0.02em;">Japanese family names</h2>
    </div>

    <article style="margin-top:14px;border:1px solid #e3ded6;border-top:3px solid #6f927f;border-radius:1rem;background:#fffefb;box-shadow:0 8px 24px rgb(78 52 54 / 0.045);padding:16px 18px;">
      <div style="display:flex;justify-content:flex-end;gap:7px;">
        <span aria-hidden="true" style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #e3e2dc;background:#faf9f5;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#59645d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </span>
        <span aria-hidden="true" style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #e3e2dc;background:#faf9f5;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#59645d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </span>
        <span aria-hidden="true" style="display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:1px solid #e3e2dc;background:#faf9f5;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#59645d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.2A4.8 4.8 0 0 0 17.2 4c-1.7 0-3.2.9-4.2 2.3C12 4.9 10.5 4 8.8 4A4.8 4.8 0 0 0 4 8.8c0 2 1.5 3.7 3 5.2l5 5z"/></svg>
        </span>
      </div>
      <p style="margin:2px 0 0;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:1.7rem;font-weight:700;line-height:1.25;font-feature-settings:'palt';">佐藤</p>
      <p style="margin:3px 0 0;font-size:0.85rem;"><strong style="font-weight:700;">Satō</strong> <span style="font-family:'Noto Sans JP',sans-serif;font-size:0.78rem;color:#6a746d;">· さとう</span></p>
      <p style="margin:9px 0 0;font-size:0.8rem;line-height:1.55;color:#59645d;">Assistant + wisteria</p>
      <div style="margin-top:11px;display:flex;flex-wrap:wrap;gap:6px;">
        <span style="border-radius:999px;background:#e6efe9;padding:3px 10px;font-size:0.66rem;font-weight:700;color:#315c4b;">Very common</span>
        <span style="border-radius:999px;border:1px solid #deddd5;background:#faf9f5;padding:3px 10px;font-size:0.66rem;font-weight:600;color:#59645d;">Clan</span>
      </div>
      <div style="margin-top:13px;border-top:1px solid #e3e2dc;padding-top:11px;display:flex;gap:14px;font-size:0.7rem;font-weight:700;color:#315c4b;">
        <span>View surname story →</span>
        <span>Use in generator</span>
      </div>
    </article>

    <article style="margin-top:12px;border:1px solid #e3ded6;border-top:3px solid #6f927f;border-radius:1rem;background:#fffefb;box-shadow:0 8px 24px rgb(78 52 54 / 0.045);padding:16px 18px;">
      <p style="margin:2px 0 0;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;font-size:1.7rem;font-weight:700;line-height:1.25;font-feature-settings:'palt';">鈴木</p>
      <p style="margin:3px 0 0;font-size:0.85rem;"><strong style="font-weight:700;">Suzuki</strong> <span style="font-family:'Noto Sans JP',sans-serif;font-size:0.78rem;color:#6a746d;">· すずき</span></p>
      <p style="margin:9px 0 0;font-size:0.8rem;line-height:1.55;color:#59645d;">Bell + tree</p>
      <div style="margin-top:11px;display:flex;flex-wrap:wrap;gap:6px;">
        <span style="border-radius:999px;background:#e6efe9;padding:3px 10px;font-size:0.66rem;font-weight:700;color:#315c4b;">Very common</span>
        <span style="border-radius:999px;border:1px solid #deddd5;background:#faf9f5;padding:3px 10px;font-size:0.66rem;font-weight:600;color:#59645d;">Historical</span>
      </div>
      <div style="margin-top:13px;border-top:1px solid #e3e2dc;padding-top:11px;display:flex;gap:14px;font-size:0.7rem;font-weight:700;color:#315c4b;">
        <span>View surname story →</span>
        <span>Use in generator</span>
      </div>
    </article>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
